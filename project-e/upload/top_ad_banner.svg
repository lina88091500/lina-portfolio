<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 130" width="1024" height="130">
  <defs>
    <!-- 背景櫻花粉柔滑漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="45%" stop-color="#F8ECEE" />
      <stop offset="80%" stop-color="#F3DBDF" />
      <stop offset="100%" stop-color="#E8B4B8" />
    </linearGradient>

    <!-- 金屬香檳金光澤漸層 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F4E8C1" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- 水感晶透粉色漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
      <stop offset="100%" stop-color="rgba(248, 236, 238, 0.4)" />
    </linearGradient>

    <!-- 柔和微陰影 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7E4A52" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 背景底色板 -->
  <rect width="1024" height="130" rx="16" fill="url(#bgGrad)" />

  <!-- 裝飾背景圓暈 -->
  <circle cx="900" cy="20" r="140" fill="#E8B4B8" opacity="0.25" />
  <circle cx="120" cy="110" r="100" fill="#FFF" opacity="0.35" />

  <!-- 左側美妝光彩圖騰與香水/精華瓶裝飾藝術 -->
  <g filter="url(#softShadow)" transform="translate(60, 15)">
    <!-- 精華液瓶身 -->
    <rect x="0" y="20" width="38" height="70" rx="10" fill="url(#glassGrad)" stroke="#E8B4B8" stroke-width="1.5" />
    <!-- 滴管蓋 -->
    <rect x="11" y="8" width="16" height="14" rx="3" fill="url(#goldGrad)" />
    <rect x="14" y="2" width="10" height="7" rx="2" fill="#7E4A52" />
    <!-- 瓶身標籤 -->
    <rect x="6" y="42" width="26" height="28" rx="4" fill="#FFF" opacity="0.9" />
    <text x="19" y="58" font-family="'Noto Serif JP', serif" font-size="8" fill="#4A353A" text-anchor="middle" font-weight="bold">BLOOM</text>
    <text x="19" y="65" font-family="sans-serif" font-size="5" fill="#8C7075" text-anchor="middle">SERUM</text>
  </g>

  <!-- 口紅唇膏視覺裝飾 -->
  <g filter="url(#softShadow)" transform="translate(115, 30)">
    <!-- 唇膏底座 -->
    <rect x="0" y="30" width="22" height="50" rx="4" fill="#4A353A" />
    <rect x="0" y="25" width="22" height="7" fill="url(#goldGrad)" />
    <!-- 膏體 -->
    <path d="M 4 25 L 4 10 Q 11 0 18 10 L 18 25 Z" fill="#E88494" />
  </g>

  <!-- 櫻花花瓣飄落點綴 -->
  <g fill="#F8ECEE" stroke="#E8B4B8" stroke-width="0.8" opacity="0.85">
    <path d="M 220,35 C 215,25 225,15 235,25 C 245,15 255,25 250,35 C 245,45 235,50 235,50 C 235,50 225,45 220,35 Z" transform="rotate(-15 235 35)" />
    <path d="M 850,75 C 845,65 855,55 865,65 C 875,55 885,65 880,75 C 875,85 865,90 865,90 C 865,90 855,85 850,75 Z" transform="rotate(25 865 75)" />
    <path d="M 940,30 C 936,22 944,14 952,22 C 960,14 968,22 964,30 C 960,38 952,42 952,42 C 952,42 944,38 940,30 Z" transform="rotate(10 952 30)" />
  </g>

  <!-- 品牌主廣告標題文字 (Gold Foil & Rosewood Typography) -->
  <g transform="translate(260, 45)">
    <!-- 活動 Tag 膠囊 -->
    <rect x="0" y="0" width="128" height="22" rx="11" fill="#7E4A52" />
    <text x="64" y="15" font-family="sans-serif" font-size="11" fill="#FFFDF9" font-weight="bold" text-anchor="middle" letter-spacing="1">🌸 2026 SPRING AD</text>

    <!-- 主廣告標題 -->
    <text x="0" y="46" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="22" font-weight="700" fill="#4A353A" letter-spacing="2">
      櫻花光采亮澤美學 ✦ 打造極致日本水光肌
    </text>

    <!-- 廣告副標題 -->
    <text x="0" y="68" font-family="'Noto Serif JP', sans-serif" font-size="12" fill="#8C7075" letter-spacing="1">
      BLOOM AESTHETIC STUDIO | 純粹植萃水感護膚與透亮底妝特輯
    </text>
  </g>

  <!-- 右側賞析按鈕視覺 -->
  <g transform="translate(840, 42)" filter="url(#softShadow)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="url(#goldGrad)" />
    <text x="65" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#4A353A" text-anchor="middle" letter-spacing="1">立即探索 →</text>
  </g>

  <!-- 邊框質感線 -->
  <rect x="1" y="1" width="1022" height="128" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
</svg>
