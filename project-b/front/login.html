<!DOCTYPE html>
<html lang="en">

<head>
     <title>管理員登入 - 尋找貓咪的家</title>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128062;</text></svg>">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
     <style>
          body {
               background: #faf8f6;
               font-family: system-ui, sans-serif;
               height: 100vh;
               display: flex;
               align-items: center;
               justify-content: center;
          }

          .login-card {
               background: #fff;
               border: 1px solid #eae5e0;
               border-radius: 12px;
               padding: 40px;
               width: 100%;
               max-width: 400px;
               box-shadow: 0 4px 12px rgba(140, 131, 123, 0.05);
          }

          .brand-title {
               color: #c08a70;
               font-weight: bold;
               font-size: 22px;
               text-align: center;
               margin-bottom: 8px;
          }

          .brand-subtitle {
               color: #8c837b;
               font-size: 14px;
               text-align: center;
               margin-bottom: 30px;
          }

          .form-label {
               color: #4a4540;
               font-weight: 500;
               font-size: 14px;
          }

          .form-control {
               border-radius: 6px;
               border: 1px solid #eae5e0;
               font-size: 14px;
               padding: 10px 12px;
               background: #faf8f6;
               margin-bottom: 20px;
          }

          .form-control:focus {
               border-color: #c08a70;
               box-shadow: none;
               background: #fff;
          }

          .btn-login {
               background: #c08a70;
               color: #fff !important;
               border: none;
               border-radius: 6px;
               font-size: 15px;
               font-weight: 500;
               width: 100%;
               padding: 10px;
               transition: background 0.2s;
          }

          .btn-login:hover {
               background: #ab775e;
          }

          .back-home {
               display: block;
               text-align: center;
               margin-top: 20px;
               color: #7d756d;
               font-size: 13px;
               text-decoration: none;
          }

          .back-home:hover {
               color: #c08a70;
          }
     </style>
</head>

<body>

     <div class="login-card">
          <div class="brand-title">🐾 尋找貓咪的家</div>
          <div class="brand-subtitle">管理員後台登入</div>

          <div style="background:#faf3ec; border:1px dashed #c08a70; border-radius:6px; color:#8c6a4f; font-size:12.5px; text-align:center; padding:8px 10px; margin-bottom:20px; line-height:1.6;">
               帳密使用登入號：<strong>admin</strong> / <strong>1234</strong><br>（前端展示，輸入任意帳密皆可進入）
          </div>

          <!-- 登入表單 -->
          <form id="loginForm">
               <div class="mb-3">
                    <label for="username" class="form-label">管理員帳號</label>
                    <input type="text" class="form-control" id="username" placeholder="請輸入帳號" required>
               </div>
               <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control" id="password" placeholder="請輸入密碼" required>
               </div>
               <button type="submit" class="btn btn-login mt-2">登入系統</button>
          </form>

          <a href="../index.html" class="back-home">← 回到前台首頁</a>
     </div>

     <script>
          // 這裡用前端 JavaScript 簡單模擬登入跳轉
          document.getElementById('loginForm').addEventListener('submit', function (e) {
               e.preventDefault(); // 阻止表單預設送出行為

               // 這是純前端的登入示範：實務上帳號密碼要送到後端 (PHP) 驗證，
               // 這裡只把「已登入」狀態與管理者名稱存進瀏覽器，讓後台頁面判斷是否放行。
               const username = document.getElementById('username').value.trim() || '管理員';

               localStorage.setItem("isLoggedIn", "true");
               localStorage.setItem("adminName", username);

               alert('登入成功！正在前往管理後台...');
               window.location.href = '../admin.html';
          });
     </script>

</body>

</html>
